before:
  hooks:
    - go mod tidy

builds:
  - ldflags:
      - -s -w -X main.version=v{{.Version}}
    env:
      - CGO_ENABLED=0
    targets:
      - linux_amd64
      - linux_arm64
      - linux_arm
archives:
  - name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Arch "amd64" }}x64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
